<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configura&#231;&#245;es</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom right, #1e1e1e, #121212);
      color: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .config-container {
      width: 100%;
      max-width: 720px;
      background: rgba(30,30,30,0.95);
      border-radius: 16px;
      box-shadow: 0 0 24px #0008;
      padding: 2.5rem 2rem 2rem 2rem;
      margin: 0 auto;
    }
    h2 {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 1em;
    }
    .form-label {
      font-weight: 500;
      color: #cccccc;
    }
    .btn-custom {
      width: 100%;
      padding: 15px;
      font-size: 1.2rem;
      margin: 10px 0;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-custom:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }
    .btn-outline-secondary {
      color: #fff;
      border-color: #fff;
    }
    .btn-outline-secondary:hover {
      background: #fff;
      color: #222;
    }
    @media (max-width: 576px) {
      h2 {
        font-size: 1.5rem;
      }
      .config-container {
        padding: 1.2rem 0.5rem;
      }
      .btn-custom {
        font-size: 1rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="config-container">
    <h2>Configura&#231;&#245;es</h2>
    <p>Defina os moradores das kitinetes. Os nomes s&#227;o salvos neste navegador e usados em &#193;gua e Luz.</p>
    <form id="formNomes">
      <div class="mb-3">
        <label for="nome1" class="form-label">Kitinet superior:</label>
        <input type="text" class="form-control" id="nome1" maxlength="80" placeholder="Nome do morador" required />
      </div>
      <div class="mb-3">
        <label for="nome2" class="form-label">Kitinet menor:</label>
        <input type="text" class="form-control" id="nome2" maxlength="80" placeholder="Nome do morador" required />
      </div>
      <div class="mb-3">
        <label for="nome3" class="form-label">Kitinete maior:</label>
        <input type="text" class="form-control" id="nome3" maxlength="80" placeholder="Nome do morador" required />
      </div>
      <button type="submit" class="btn btn-primary btn-custom">Salvar</button>
      <a href="index.html" class="btn btn-outline-secondary btn-custom">Voltar</a>
      <div id="msgSucesso" class="text-success mt-3 d-none">Nomes salvos!</div>
    </form>
        <!-- INTEGRAÇÃO TUYA -->
        <div class="card border-info mb-4 bg-dark text-light">
          <div class="card-body">
            <h5 class="card-title"><i class="bi bi-cloud-arrow-down"></i> Disjuntores Tuya</h5>
            <p class="text-light small mb-3">Configure os medidores da kitinete maior e da kitinet menor. DP e divisor vazios usam a detec&#231;&#227;o autom&#225;tica.</p>
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label" id="tuyaLabel1">Device ID - Pessoa 1</label>
                <input class="form-control" id="tuyaDevice1" placeholder="Device ID Tuya">
              </div>
              <div class="col-md-6">
                <label class="form-label" id="tuyaLabel2">Device ID - Pessoa 2</label>
                <input class="form-control" id="tuyaDevice2" placeholder="Device ID Tuya">
              </div>
              <div class="col-md-3">
                <label class="form-label">DP energia 1 (opcional)</label>
                <input class="form-control" id="tuyaDp1" placeholder="Ex: add_ele">
              </div>
              <div class="col-md-3">
                <label class="form-label">Divisor 1 (opcional)</label>
                <input type="number" min="0.000001" step="any" class="form-control" id="tuyaDivisor1" placeholder="Auto">
              </div>
              <div class="col-md-3">
                <label class="form-label">DP energia 2 (opcional)</label>
                <input class="form-control" id="tuyaDp2" placeholder="Ex: add_ele">
              </div>
              <div class="col-md-3">
                <label class="form-label">Divisor 2 (opcional)</label>
                <input type="number" min="0.000001" step="any" class="form-control" id="tuyaDivisor2" placeholder="Auto">
              </div>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-3">
              <button type="button" class="btn btn-outline-info" onclick="salvarConfiguracaoTuya()" id="btnSalvarTuya" disabled><i class="bi bi-save"></i> Salvar Tuya</button>
            </div>
            <div id="tuyaStatus" class="small mt-2"></div>
          </div>
        </div>


  </div>
  <script src="nomes.js"></script>
  <script>
    // Proteger acesso: só logado
    if (!localStorage.getItem('token')) {
      window.location.href = 'login.html';
    }
    const campos = [document.getElementById('nome3'), document.getElementById('nome2'), document.getElementById('nome1')];
    getNomesDinamicos().forEach((nome, i) => { campos[i].value = nome; });
    campos.forEach(campo => campo.addEventListener('input', () => {
      campo.setCustomValidity('');
      document.getElementById('msgSucesso').classList.add('d-none');
    }));
    document.getElementById('formNomes').addEventListener('submit', function(e) {
      e.preventDefault();
      for (const campo of campos) {
        campo.setCustomValidity(campo.value.trim() ? '' : 'Informe o nome do morador.');
      }
      if (!this.reportValidity()) return;
      try {
        salvarNomesKitinetes(campos.map(campo => campo.value));
        atualizarLabelsTuya();
        document.getElementById('msgSucesso').classList.remove('d-none');
      } catch (error) {
        alert('N?o foi poss?vel salvar os nomes. ' + error.message);
      }
    });

const API_ROOT = 'http://localhost:3000/api';
async function carregarConfiguracaoTuya() {
  const token = localStorage.getItem('token');
  try {
    const resp = await fetch(`${API_ROOT}/tuya/config`, { headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
    if (!resp.ok) throw new Error(resp.status === 401 ? 'Entre novamente para configurar a Tuya.' : 'Falha ao carregar a Tuya.');
    const cfg = await resp.json();
    document.getElementById('tuyaDevice1').value = cfg.pessoa1?.deviceId || '';
    document.getElementById('tuyaDp1').value = cfg.pessoa1?.dpCode || '';
    document.getElementById('tuyaDivisor1').value = cfg.pessoa1?.divisor || '';
    document.getElementById('tuyaDevice2').value = cfg.pessoa2?.deviceId || '';
    document.getElementById('tuyaDp2').value = cfg.pessoa2?.dpCode || '';
    document.getElementById('tuyaDivisor2').value = cfg.pessoa2?.divisor || '';
    document.getElementById('btnSalvarTuya').disabled = false;
  } catch (e) { document.getElementById('tuyaStatus').textContent = e.message; console.warn('Configuração Tuya indisponível:', e); }
}

async function salvarConfiguracaoTuya() {
  const token = localStorage.getItem('token');
  const status = document.getElementById('tuyaStatus');
  const num = id => {
    const v = document.getElementById(id).value.trim();
    return v ? Number(v) : null;
  };
  for (const id of ['tuyaDivisor1', 'tuyaDivisor2']) {
    if (!document.getElementById(id).reportValidity()) return;
  }
  const payload = {
    pessoa1: { deviceId: document.getElementById('tuyaDevice1').value.trim(), dpCode: document.getElementById('tuyaDp1').value.trim(), divisor: num('tuyaDivisor1') },
    pessoa2: { deviceId: document.getElementById('tuyaDevice2').value.trim(), dpCode: document.getElementById('tuyaDp2').value.trim(), divisor: num('tuyaDivisor2') }
  };
  status.className = 'small mt-2 text-info'; status.textContent = 'Salvando configuração...';
  try {
    const resp = await fetch(`${API_ROOT}/tuya/config`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) }, body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.erro || data.detalhes || 'Falha ao salvar.');
    status.className = 'small mt-2 text-success'; status.textContent = 'Configuração Tuya salva.';
  } catch (e) {
    status.className = 'small mt-2 text-danger'; status.textContent = e.message;
  }
}


function atualizarLabelsTuya() {
  const nomes = getNomesDinamicos();
  document.getElementById('tuyaLabel1').textContent = 'Kitinete maior: ' + nomes[0] + ' - Device ID';
  document.getElementById('tuyaLabel2').textContent = 'Kitinet menor: ' + nomes[1] + ' - Device ID';
}
atualizarLabelsTuya();
if (localStorage.getItem('token')) carregarConfiguracaoTuya();
  </script>
</body>
</html>
